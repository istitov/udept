name: CI

on:
  push:
    branches: [main, modernization]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly run against fresh gentoo/stage3:latest. Upstream Portage
  # drift is the usual cause of breakage in this codebase (the script
  # is its own Portage engine, written against a layout that's been
  # moving for ~20 years), so a scheduled run catches "Portage changed
  # something and dep no longer parses it" before a user files a bug.
  # Mondays 06:00 UTC: after the weekend's tree updates, before the
  # work week. GitHub only fires schedules on the default branch.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Cancel in-flight runs of the same workflow on the same ref when a
# new push arrives — keeps two runs from racing on rapid commits.
# Scheduled runs use `github.run_id` to avoid cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: gentoo/stage3 — build + bats + smoke
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3:latest

    steps:
      # actions/checkout's runner needs node + git inside the container;
      # stage3 ships neither, so emerge them from the binhost. Two
      # prerequisites first:
      #   1. emerge-webrsync to populate /var/db/repos/gentoo — stage3:latest
      #      ships an empty tree and any emerge bails with "Invalid Repository
      #      Location" before doing anything. Faster than --sync for one-shot
      #      CI (tarball + GPG verify vs. full rsync); uses the gentoo-release
      #      keys that ship in stage3.
      #   2. getuto to populate /etc/portage/gnupg/ with the binhost trust
      #      keyring. Without it, portage tries to verify the signed binpkgs
      #      it downloads and bails with NO_PUBKEY — which is what we hit on
      #      the first run of this workflow. portage names getuto via
      #      $PORTAGE_TRUST_HELPER and points at it in error output.
      - name: Bootstrap container (git + node for actions/checkout)
        run: |
          emerge-webrsync --quiet
          getuto
          emerge --quiet-build --usepkg=y --getbinpkg=y \
            dev-vcs/git net-libs/nodejs

      # The workspace is bind-mounted from a different uid; git refuses to
      # operate on it without an explicit safe.directory entry. Use --system
      # so the entry is readable by the 'portage' user too — the merge step
      # below clones the workspace via file:// and that runs userpriv'd.
      - name: Trust workspace for git ownership check
        run: git config --system --add safe.directory '*'

      # fetch-depth: 0 — actions/checkout defaults to a shallow clone
      # (depth 1). The merge step further down feeds this workspace to
      # the live ebuild via git-r3 over file://, and git-r3 refuses to
      # write refs that land on shallow grafts ("shallow roots are not
      # allowed to be updated"). Full history avoids that. udept is a
      # small repo, so the extra bandwidth is negligible.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The stuff overlay hosts both the live udept-9999.ebuild (used by
      # the post-build merge step) and the bats-support / bats-assert
      # helpers (which aren't in ::gentoo). Configure it directly via
      # repos.conf — `eselect repository` would require emerging
      # app-eselect/eselect-repository first, which isn't in @system.
      - name: Add stuff overlay
        run: |
          mkdir -p /etc/portage/repos.conf
          cat >/etc/portage/repos.conf/stuff.conf <<'EOF'
          [stuff]
          location = /var/db/repos/stuff
          sync-type = git
          sync-uri = https://github.com/istitov/stuff
          auto-sync = yes
          EOF
          emaint sync -r stuff

      - name: Install autotools + bats stack
        run: |
          # bats-support / bats-assert on the stuff overlay are keyworded
          # ~amd64; stage3:latest defaults to stable amd64. Unmask just
          # those two atoms — narrower than setting ACCEPT_KEYWORDS=~amd64
          # for the whole step, which would also unmask transitive deps.
          mkdir -p /etc/portage/package.accept_keywords
          cat >/etc/portage/package.accept_keywords/bats-helpers <<'EOF'
          dev-util/bats-support ~amd64
          dev-util/bats-assert  ~amd64
          EOF
          # zsh is needed by the syntax-check step below — stage3:latest
          # ships only bash. zsh is small (~5MB binpkg) and adds maybe
          # 30s to bootstrap; cheap insurance against a typo in the
          # zsh-completion template landing silently.
          emerge --quiet-build --usepkg=y --getbinpkg=y \
            dev-build/autoconf dev-build/automake \
            dev-util/bats dev-util/bats-support dev-util/bats-assert \
            dev-util/shellcheck-bin \
            app-shells/zsh

      - name: autoreconf -i
        run: autoreconf -i

      - name: configure
        run: ./configure

      - name: build
        run: make -j"$(nproc)"

      # Verify the all-local hook in src/Makefile.am that chmod +x's
      # src/dep — autoconf's @VAR@ substitution doesn't preserve modes
      # so the build-tree binary lands as 644 by default. tests/smoke.sh
      # has its own defensive chmod which would mask a regression here;
      # this step exercises the build path directly.
      - name: chmod regression — src/dep is executable post-build
        run: |
          rm -f src/dep
          make -s
          if [[ ! -x src/dep ]]; then
            echo "FAIL: src/dep was not made executable by 'make'" >&2
            ls -la src/dep
            echo "Likely cause: 'all-local: dep' hook missing from src/Makefile.am" >&2
            exit 1
          fi
          echo "src/dep mode after build: $(stat -c '%a' src/dep)"

      # shellcheck the BUILT script (src/dep), not the .in template —
      # @PACKAGE_VERSION@ is a substitution token, not a bash construct,
      # and shellcheck would flag the surrounding context wrongly.
      # --severity=error suppresses style nits; only correctness-level
      # findings (SC2xxx errors, syntax) break the build. The version-
      # comparison block in comm_ver intentionally uses negative returns
      # for signed-magnitude via bash's mod-256 truncation (see source
      # comments at the function definition) — covered by an inline
      # `shellcheck disable` annotation.
      - name: shellcheck
        run: shellcheck --severity=error src/dep

      # Both completion files are generated by config.status / Makefile
      # rules from templates + an option-table dump. A typo in a
      # template lands silently — neither make nor make check parses
      # the generated output. bash -n / zsh -n catch them up front.
      - name: syntax-check generated completion files
        run: |
          bash -n completion/dep
          zsh -n completion/_dep

      # Functional check: load + invoke each completion once, verify
      # it produces a non-empty option-table view. Catches the class
      # of bug where the build produces a syntactically-valid file
      # whose first invocation returns no candidates — e.g. when the
      # option-table arrays land AFTER the `_dep "$@"` entry-point
      # call (zsh autoload runs file body == function body, so order
      # matters). Found and fixed during the post-0.7.2 verification
      # pass; this step ensures it can't quietly regress.
      - name: functional-check completion first-invocation
        run: |
          # zsh: autoload, invoke once, assert option-table count > 0.
          # Use exec env so failure exits this step.
          zsh -f -c '
            fpath=("$PWD/completion" $fpath)
            autoload -Uz _dep
            _dep dummy 2>/dev/null
            : ${__dep_count:=0}
            if (( __dep_count > 0 )); then
              print "zsh completion: __dep_count=$__dep_count (ok)"
            else
              print "zsh completion: FAIL — option-table arrays empty after first invocation"
              print "  symptom: first TAB-press in a fresh shell returns no candidates"
              print "  likely cause: \`_dep \"\$@\"\` invocation precedes the typeset -ga"
              print "  array declarations in completion/_dep; check build rule in"
              print "  completion/Makefile.am"
              exit 1
            fi
          '

          # bash: source, simulate TAB on `dep --`, assert COMPREPLY > 0.
          bash -c '
            source completion/dep
            COMP_WORDS=(dep "--")
            COMP_CWORD=1
            COMP_LINE="dep --"
            COMP_POINT=6
            _dep_completion
            n=${#COMPREPLY[@]}
            if (( n > 0 )); then
              echo "bash completion: COMPREPLY size=$n (ok)"
            else
              echo "bash completion: FAIL — empty COMPREPLY after _dep_completion"
              echo "  symptom: TAB on \`dep --\` offers no candidates"
              exit 1
            fi
          '

      - name: bats unit suite
        run: make check

      # distcheck (vs plain dist) extracts the tarball into a subdir and
      # runs configure + make + make check + make install + make uninstall
      # against it — catches missing EXTRA_DIST entries and srcdir-vs-builddir
      # bugs that plain `make dist` would not surface (the doc/ and
      # completion/ rules originally pointed at $(top_srcdir)/src/dep
      # instead of $(top_builddir)/src/dep — invisible in-tree, fatal
      # under distcheck's split layout).
      - name: dist tarball sanity-check
        run: make distcheck

      # Bats-driven smoke tier: runs the BUILT src/dep against the
      # container's real Portage tree (the same one populated by
      # emerge-webrsync above), asserting per-test exit status + a
      # structural output marker for each dispatch path. Per-test
      # pass/fail surfaces in the GitHub Actions log (TAP format)
      # without the snapshot-diff bootstrap step that the previous
      # shell harness needed. tests/smoke.sh remains in-tree for
      # local snapshot work (make smoke / smoke-baseline / smoke-diff)
      # but is no longer CI-gating.
      - name: bats smoke suite (real Portage tree)
        run: make check-smoke

      # Real ebuild merge path. Rewrites the live ebuild's EGIT_REPO_URI
      # to fetch from the CI workspace instead of origin/main (so the
      # merge tests this branch's code, not master), and emerges. Catches
      # autotools install-path regressions, ebuild USE-flag wiring,
      # bash-completion install location, etc. — none of which 'make
      # check' touches.
      - name: emerge =app-portage/udept-9999 (real merge path)
        env:
          # Sandbox bypasses are needed because Docker doesn't grant the
          # unshare/namespace caps that FEATURES=*-sandbox would require.
          # FEATURES=test is *not* set here — see package.env below for why
          # it has to be scoped per-atom rather than at the step level.
          FEATURES: "-sandbox -usersandbox -ipc-sandbox -network-sandbox"
        run: |
          # udept-9999 is a live ebuild, so it has KEYWORDS="" (not even
          # ~amd64). '**' is the only keyword spec that accepts unkeyworded
          # ebuilds. Per-atom rather than step-level env, matching the
          # bats-helpers pattern above.
          cat >/etc/portage/package.accept_keywords/udept <<'EOF'
          =app-portage/udept-9999 **
          EOF

          # FEATURES=test scoped to udept only via package.env. A step-level
          # 'FEATURES: test' propagates test mode across the entire dependency
          # graph — every transitive dep (setuptools, pip, pillow, cryptography,
          # maturin, ...) gets pulled in with [test] enabled, which produces
          # slot conflicts and unsatisfiable REQUIRED_USE on the python tooling
          # (e.g. dev-python/pillow needs jpeg2k+lcms+tiff+truetype with test;
          # setuptools-79 vs. installed setuptools-82 collide on slot 0). The
          # python deps come in via the autotools eclass / build-host tooling
          # rather than udept itself (udept is pure bash). package.env applies
          # the FEATURES override only to the named atom, so src_test runs for
          # udept-9999 and the rest of the graph merges with default USE.
          mkdir -p /etc/portage/env /etc/portage/package.env
          echo 'FEATURES="${FEATURES} test"' >/etc/portage/env/udept-test.conf
          cat >/etc/portage/package.env/udept <<'EOF'
          =app-portage/udept-9999 udept-test.conf
          EOF
          overlay=$(portageq get_repo_path / stuff)
          ebuild="$overlay/app-portage/udept/udept-9999.ebuild"
          [[ -f "$ebuild" ]] || { echo "expected $ebuild in stuff overlay"; exit 1; }
          sed -i 's|EGIT_REPO_URI="[^"]*"|EGIT_REPO_URI="file://'"$GITHUB_WORKSPACE"'"|' "$ebuild"
          # Verify the sed actually rewrote — if the live ebuild's format
          # ever changes (multi-line URI, different quoting), the sed
          # silently no-ops and we'd test origin/master not this branch.
          grep -q 'EGIT_REPO_URI="file://' "$ebuild" \
            || { echo "EGIT_REPO_URI rewrite did not take effect; check $ebuild format"; exit 1; }

          # actions/checkout@v4 leaves HEAD detached at $GITHUB_SHA. git-r3
          # then does 'git fetch <url> +HEAD:refs/git-r3/HEAD' against the
          # workspace, but a detached HEAD is not advertised as a symref by
          # upload-pack, so the destination ref doesn't get created and
          # git-r3 dies at the verify step with "Referencing HEAD failed
          # (wrong ref?)" even though the objects fetched fine. Re-attach
          # HEAD to a real branch so the fetch sees a normal symref. The
          # branch name is fixed ('ci-build') because $GITHUB_REF_NAME can
          # contain slashes for tags / pull_request refs.
          git -C "$GITHUB_WORKSPACE" checkout -B ci-build

          # git 2.38+ disabled file:// transport by default (CVE-2022-39253);
          # the live ebuild's git-r3 fetch needs it for the workspace clone.
          # Use --system, not --global: emerge runs ebuild phases as the
          # 'portage' user (FEATURES=userpriv), which reads /etc/gitconfig
          # but not /root/.gitconfig.
          git config --system protocol.file.allow always

          emerge --quiet-build --usepkg=y --getbinpkg=y =app-portage/udept-9999

      - name: post-merge sanity (installed binary)
        run: |
          command -v dep
          dep --version
          dep --help | head -3
